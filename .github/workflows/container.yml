name: Container

on:
  pull_request:
  push:
    tags:
      - "v*"

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Build and smoke-test container
        run: sh scripts/ci/test-container.sh

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: yeoul:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Remove smoke-test image
        if: always()
        run: |
          if docker image inspect yeoul:ci >/dev/null 2>&1; then
            docker image rm yeoul:ci
          fi

  publish:
    if: github.repository == 'mrchypark/yeoul' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Validate semantic version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$ ]]

      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/mrchypark/yeoul
          tags: |
            type=ref,event=tag
            type=match,pattern=v(.*),group=1
          flavor: latest=false

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Verify published digest, platforms, and attestations
        env:
          IMAGE: ghcr.io/mrchypark/yeoul
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="$IMAGE@$DIGEST"
          docker buildx imagetools inspect --raw "$ref" > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64")) | .architecture] | unique | sort == ["amd64", "arm64"]' manifest.json
          jq -e '[.manifests[].annotations["vnd.docker.reference.type"] // empty] | any(. == "attestation-manifest")' manifest.json
          docker pull --platform linux/amd64 "$ref"
          # Classic Docker stores cannot register two platforms under one digest locally.
          docker image rm "$ref"
          docker pull --platform linux/arm64 "$ref"
          docker image rm "$ref"
