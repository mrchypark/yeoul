schema_version: "1"
display_name: "Yeoul Memory"
short_description: "Use Yeoul CLI, agent-pack recipes, and memory rules safely in this repo."
default_prompt: "Use Yeoul proactively: treat Yeoul Core as a memory substrate, not an agent runtime; prefer the user-level database at $HOME/.local/share/yeoul/work-memory.lbug for normal work; verify local installs against the real user-level database; search with recipe-backed CLI workflows before recommendations, status interpretation, or non-trivial work when prior context may matter; check for contradictions before asserting facts; record durable outcomes when they become clear; promote only confirmed durable claims to facts with supporting episodes; preserve provenance and lifecycle semantics; use fact supersede/retract instead of overwriting old facts; keep backups when full-fidelity restore is unavailable; and prefer public CLI/API workflows over raw storage queries."
