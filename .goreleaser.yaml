version: 2

project_name: yeoul

release:
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  mode: keep-existing

checksum:
  name_template: "checksums_{{ .Env.RELEASE_TARGET }}.txt"

builds:
  - id: yeoul-linux-amd64
    main: ./cmd/yeoul
    binary: bin/yeoul
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: "{{ if ne .Env.RELEASE_TARGET \"linux-amd64\" }}true{{ else }}false{{ end }}"
  - id: yeould-linux-amd64
    main: ./cmd/yeould
    binary: bin/yeould
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: "{{ if ne .Env.RELEASE_TARGET \"linux-amd64\" }}true{{ else }}false{{ end }}"
  - id: yeoul-linux-arm64
    main: ./cmd/yeoul
    binary: bin/yeoul
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: "{{ if ne .Env.RELEASE_TARGET \"linux-arm64\" }}true{{ else }}false{{ end }}"
  - id: yeould-linux-arm64
    main: ./cmd/yeould
    binary: bin/yeould
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: "{{ if ne .Env.RELEASE_TARGET \"linux-arm64\" }}true{{ else }}false{{ end }}"
  - id: yeoul-darwin-amd64
    main: ./cmd/yeoul
    binary: bin/yeoul
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: "{{ if ne .Env.RELEASE_TARGET \"darwin-amd64\" }}true{{ else }}false{{ end }}"
  - id: yeould-darwin-amd64
    main: ./cmd/yeould
    binary: bin/yeould
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: "{{ if ne .Env.RELEASE_TARGET \"darwin-amd64\" }}true{{ else }}false{{ end }}"
  - id: yeoul-darwin-arm64
    main: ./cmd/yeoul
    binary: bin/yeoul
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: "{{ if ne .Env.RELEASE_TARGET \"darwin-arm64\" }}true{{ else }}false{{ end }}"
  - id: yeould-darwin-arm64
    main: ./cmd/yeould
    binary: bin/yeould
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: "{{ if ne .Env.RELEASE_TARGET \"darwin-arm64\" }}true{{ else }}false{{ end }}"
  - id: yeoul-windows-amd64
    main: ./cmd/yeoul
    binary: bin/yeoul
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: "{{ if ne .Env.RELEASE_TARGET \"windows-amd64\" }}true{{ else }}false{{ end }}"
  - id: yeould-windows-amd64
    main: ./cmd/yeould
    binary: bin/yeould
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: "{{ if ne .Env.RELEASE_TARGET \"windows-amd64\" }}true{{ else }}false{{ end }}"

archives:
  - id: archive-linux-amd64
    ids:
      - yeoul-linux-amd64
      - yeould-linux-amd64
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    wrap_in_directory: true
  - id: archive-linux-arm64
    ids:
      - yeoul-linux-arm64
      - yeould-linux-arm64
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    wrap_in_directory: true
  - id: archive-darwin-amd64
    ids:
      - yeoul-darwin-amd64
      - yeould-darwin-amd64
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    wrap_in_directory: true
  - id: archive-darwin-arm64
    ids:
      - yeoul-darwin-arm64
      - yeould-darwin-arm64
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    wrap_in_directory: true
  - id: archive-windows-amd64
